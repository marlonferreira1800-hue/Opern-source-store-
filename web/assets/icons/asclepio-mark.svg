  <rect x="247" y="96" width="18" height="330" rx="9" fill="url(#staff)"/>
  <circle cx="256" cy="82" r="24" fill="url(#staff)"/>
  <rect x="234" y="416" width="44" height="14" rx="7" fill="url(#staff)"/>

  <!-- Head -->
  <circle cx="320" cy="110" r="21" fill="#8b5cf6"/>
  <circle cx="312" cy="103" r="4.5" fill="#09090b"/>
  <circle cx="328" cy="103" r="4.5" fill="#09090b"/>
  <path d="M338 118 L362 108 M338 118 L364 122" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Terminal cursor tail -->
