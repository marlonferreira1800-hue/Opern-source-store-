<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Source Store - ArtCraft Style</title>
    <link rel="stylesheet" href="src/styles/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Update Banner -->
        <div id="update-banner" class="update-banner hidden">
            <div class="banner-content">
                <span class="banner-icon">🔄</span>
                <span class="banner-text">ATUALIZAR Open Source Store 0.1.0 está disponível.</span>
                <div class="banner-actions">
                    <button class="btn btn-primary btn-small" onclick="updateAndRestart()">ATUALIZAR E REINICIAR</button>
                    <button class="btn btn-text btn-small" onclick="closeBanner()">✕</button>
                </div>
            </div>
        </div>

        <!-- Top Bar -->
        <header class="top-bar">
            <div class="top-bar-left">
                <h1 class="logo">OPEN SOURCE STORE</h1>
            </div>
            <div class="top-bar-center">
                <button class="btn btn-secondary" onclick="updateAll()">
                    <span id="update-count">ATUALIZAR 0 APLICATIVO</span>
                </button>
                <select id="sort-select" class="sort-select" onchange="sortApps()">
                    <option value="name_asc">Nome (A-Z)</option>
                    <option value="name_desc">Nome (Z-A)</option>
                    <option value="recent">Mais recentes</option>
                    <option value="popular">Mais populares</option>
                    <option value="rating">Maior avaliação</option>
                </select>
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Buscar aplicativos" onkeyup="searchApps()">
                    <button class="btn btn-icon" onclick="searchApps()">🔍</button>
                </div>
            </div>
            <div class="top-bar-right">
                <button class="btn btn-icon" onclick="toggleMenu()">☰</button>
            </div>
        </header>

        <!-- Navigation Bar -->
        <nav class="nav-bar">
            <span class="nav-title">NÃO INSTALADOS</span>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <div class="apps-grid" id="apps-grid">
                <!-- Apps will be loaded here -->
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Carregando aplicativos...</p>
                </div>
            </div>
        </main>

        <!-- App Detail Modal -->
        <div id="app-detail-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <button class="btn btn-icon btn-close" onclick="closeDetailModal()">✕</button>
                </div>
                <div class="modal-body" id="app-detail-content">
                    <!-- App details will be loaded here -->
                </div>
            </div>
        </div>

        <!-- Download Modal -->
        <div id="download-modal" class="modal hidden">
            <div class="modal-content modal-small">
                <div class="modal-header">
                    <h2>Baixando aplicativo...</h2>
                    <button class="btn btn-icon btn-close" onclick="cancelDownload()">✕</button>
                </div>
                <div class="modal-body">
                    <div class="download-progress">
                        <div class="progress-bar">
                            <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
                        </div>
                        <p id="download-status">Iniciando download...</p>
                        <p id="download-info"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Menu Sidebar -->
        <div id="menu-sidebar" class="sidebar hidden">
            <div class="sidebar-header">
                <h2>OPEN SOURCE STORE</h2>
                <button class="btn btn-icon btn-close" onclick="toggleMenu()">✕</button>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="sidebar-link active" onclick="showAllApps()">
                    <span>🏠 Todos os Apps</span>
                </a>
                <a href="#" class="sidebar-link" onclick="showFeaturedApps()">
                    <span>⭐ Destaques</span>
                </a>
                <a href="#" class="sidebar-link" onclick="showPopularApps()">
                    <span>🔥 Populares</span>
                </a>
                <a href="#" class="sidebar-link" onclick="showRecentApps()">
                    <span>🆕 Recentes</span>
                </a>
                <div class="sidebar-divider"></div>
                <h3 class="sidebar-title">Categorias</h3>
                <div id="sidebar-categories">
                    <!-- Categories will be loaded here -->
                </div>
            </nav>
            <div class="sidebar-footer">
                <p>v0.1.0</p>
            </div>
        </div>

        <!-- Overlay for modals -->
        <div id="modal-overlay" class="modal-overlay hidden" onclick="closeAllModals()"></div>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
