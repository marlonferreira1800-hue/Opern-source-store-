<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Source Store</title>
    <link rel="stylesheet" href="src/styles/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">

        <!-- Top Bar -->
        <header class="top-bar">
            <div class="top-bar-left">
                <h1 class="logo">OPEN SOURCE STORE</h1>
                <span class="logo-sub">RUST + TAURI</span>
            </div>
            <div class="top-bar-center">
                <button class="btn btn-secondary" id="update-all-btn" onclick="updateAll()">
                    <span id="update-count">ATUALIZAR 0 APLICATIVOS</span>
                </button>
                <button class="btn btn-secondary" id="refresh-btn" onclick="refreshCatalog()" title="Buscar novamente no GitHub">&#8635; ATUALIZAR LOJA</button>
                <select id="sort-select" class="sort-select" onchange="sortApps()">
                    <option value="name_asc">Nome (A-Z)</option>
                    <option value="name_desc">Nome (Z-A)</option>
                    <option value="stars">Mais estrelas</option>
                    <option value="downloads">Mais baixados</option>
                    <option value="recent">Mais recentes</option>
                </select>
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Buscar no GitHub..." onkeyup="onSearchKey(event)">
                    <button class="btn btn-icon" onclick="searchGitHub()">&#128269;</button>
                </div>
            </div>
            <div class="top-bar-right">
                <button class="btn btn-icon" onclick="toggleMenu()">&#9776;</button>
            </div>
        </header>

        <!-- Status bar -->
        <div id="status-bar" class="status-bar hidden"></div>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Instalados -->
            <section id="section-installed" class="app-section hidden">
                <h2 class="section-title">INSTALADOS</h2>
                <div class="apps-grid" id="installed-grid"></div>
            </section>

            <!-- Não instalados -->
            <section id="section-store" class="app-section">
                <h2 class="section-title" id="store-title">NÃO INSTALADOS</h2>
                <div class="apps-grid" id="apps-grid">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Buscando aplicativos open source no GitHub...</p>
                    </div>
                </div>
            </section>
        </main>

        <!-- App Detail Modal -->
        <div id="app-detail-modal" class="modal modal-large hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <button class="btn btn-icon btn-close" onclick="closeDetailModal()">&#10005;</button>
                </div>
                <div class="modal-body" id="app-detail-content"></div>
            </div>
        </div>

        <!-- Download Modal -->
        <div id="download-modal" class="modal modal-small hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="download-title">Baixando aplicativo...</h2>
                    <button class="btn btn-icon btn-close" onclick="cancelDownload()">&#10005;</button>
                </div>
                <div class="modal-body">
                    <div class="download-progress">
                        <div class="progress-bar">
                            <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
                        </div>
                        <p id="download-status">Iniciando download...</p>
                        <p id="download-info"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Menu Sidebar -->
        <div id="menu-sidebar" class="sidebar hidden">
            <div class="sidebar-header">
                <h2>OPEN SOURCE STORE</h2>
                <button class="btn btn-icon btn-close" onclick="toggleMenu()">&#10005;</button>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="sidebar-link active" onclick="showAllApps()"><span>&#127968; Todos os Apps</span></a>
                <a href="#" class="sidebar-link" onclick="showInstalled()"><span>&#128230; Instalados</span></a>
                <a href="#" class="sidebar-link" onclick="showUpdates()"><span>&#128260; Atualizações</span></a>
                <div class="sidebar-divider"></div>
                <h3 class="sidebar-title">Categorias</h3>
                <div id="sidebar-categories"></div>
                <div class="sidebar-divider"></div>
                <h3 class="sidebar-title">Configurações</h3>
                <div class="sidebar-settings">
                    <label class="settings-label">GitHub token (opcional, aumenta o limite da API)</label>
                    <div class="settings-row">
                        <input type="password" id="github-token-input" placeholder="ghp_..." class="settings-input">
                        <button class="btn btn-secondary btn-small" onclick="saveToken()">Salvar</button>
                    </div>
                    <p class="settings-hint" id="downloads-path"></p>
                </div>
            </nav>
            <div class="sidebar-footer">
                <p>v0.1.0 &bull; 100% Rust</p>
            </div>
        </div>

        <!-- Overlay -->
        <div id="modal-overlay" class="modal-overlay hidden" onclick="closeAllModals()"></div>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
