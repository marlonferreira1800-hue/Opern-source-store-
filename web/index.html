<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenStore — Open Source Store</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/openstore-mark.svg">
    <link rel="stylesheet" href="src/styles/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">

        <!-- Row 1: Brand & System Header -->
        <header class="top-brand-bar">
            <div class="brand-left">
                <img src="assets/icons/openstore-mark.svg" alt="OpenStore" class="brand-mark">
                <h1 class="brand-logo">OPENSTORE</h1>
                <span class="brand-divider" aria-hidden="true"></span>
                <span class="brand-sub">OPEN SOURCE APP SUITE</span>
            </div>
            <div class="brand-right">
                <button class="icon-header-btn" id="notif-btn" data-action="show-updates" title="Atualizações disponíveis" aria-label="Atualizações disponíveis">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                    <span class="notif-dot hidden" id="notif-dot"></span>
                </button>
                <button class="icon-header-btn" data-action="open-settings" title="Configurações e Categorias" aria-label="Configurações e Categorias">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                </button>
                <button class="icon-header-btn" data-action="toggle-menu" title="Menu" aria-label="Menu">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
            </div>
        </header>

        <!-- Row 2: Controls Toolbar -->
        <div class="top-controls-bar">
            <div class="controls-left">
                <div class="segmented-tabs" role="tablist">
                    <button class="tab-btn active" id="tab-apps" data-action="tab-apps" role="tab" aria-selected="true">APLICATIVOS</button>
                    <button class="tab-btn" id="tab-installed" data-action="tab-installed" role="tab" aria-selected="false">INSTALADOS</button>
                </div>
                <button class="square-tool-btn" id="refresh-btn" data-action="refresh-catalog" title="Atualizar catálogo do GitHub" aria-label="Atualizar catálogo">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"><path d="M21.5 2v6h-6"/><path d="M2.5 22v-6h6"/><path d="M2 11.5a10 10 0 0 1 18.8-4.3L21.5 8"/><path d="M22 12.5a10 10 0 0 1-18.8 4.2L2.5 16"/></svg>
                </button>
            </div>

            <div class="controls-right">
                <button class="btn-contrast" id="update-all-btn" data-action="update-all">
                    <span id="update-count">ATUALIZAR TODOS (0)</span>
                </button>

                <div class="sort-group">
                    <label for="sort-select" class="sort-label">ORDENAR</label>
                    <select id="sort-select" class="sort-select">
                        <option value="trust">Maior confiança</option>
                        <option value="name_asc">Nome (A-Z)</option>
                        <option value="name_desc">Nome (Z-A)</option>
                        <option value="stars">Mais estrelas</option>
                        <option value="downloads">Mais baixados</option>
                        <option value="recent">Mais recentes</option>
                    </select>
                </div>

                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Buscar aplicativos">
                </div>

                <div class="view-toggle" role="group" aria-label="Modo de visualização">
                    <button class="view-btn active" id="view-grid-btn" data-action="set-view" data-view="grid" title="Grade" aria-label="Visualização em grade">
                        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="6" height="6"/><rect x="9" y="1" width="6" height="6"/><rect x="1" y="9" width="6" height="6"/><rect x="9" y="9" width="6" height="6"/></svg>
                    </button>
                    <button class="view-btn" id="view-list-btn" data-action="set-view" data-view="list" title="Lista" aria-label="Visualização em lista">
                        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="2" width="14" height="2"/><rect x="1" y="7" width="14" height="2"/><rect x="1" y="12" width="14" height="2"/></svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Status bar -->
        <div id="status-bar" class="status-bar hidden"></div>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Instalados -->
            <section id="section-installed" class="app-section hidden">
                <div class="apps-grid" id="installed-grid"></div>
            </section>

            <!-- Não instalados / Loja -->
            <section id="section-store" class="app-section">
                <h2 class="section-title" id="store-title">NÃO INSTALADOS</h2>
                <div class="apps-grid" id="apps-grid">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Buscando aplicativos open source no GitHub...</p>
                    </div>
                </div>
            </section>
        </main>

        <!-- App Detail Modal -->
        <div id="app-detail-modal" class="modal modal-large hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <span class="modal-header-label">DETALHES DO APLICATIVO</span>
                    <button class="btn-close" data-action="close-detail-modal" aria-label="Fechar">&#10005;</button>
                </div>
                <div class="modal-body" id="app-detail-content"></div>
            </div>
        </div>

        <!-- Download Modal -->
        <div id="download-modal" class="modal modal-small hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="download-title">BAIXANDO APLICATIVO...</h2>
                    <button class="btn-close" data-action="cancel-download" aria-label="Cancelar">&#10005;</button>
                </div>
                <div class="modal-body">
                    <div class="download-progress">
                        <div class="progress-bar">
                            <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
                        </div>
                        <p id="download-status">Iniciando download...</p>
                        <p id="download-info"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Menu Sidebar -->
        <div id="menu-sidebar" class="sidebar hidden">
            <div class="sidebar-header">
                <img src="assets/icons/openstore-mark.svg" alt="" class="brand-mark-lg">
                <h2>OPENSTORE</h2>
                <button class="btn-close" data-action="toggle-menu" aria-label="Fechar menu">&#10005;</button>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="sidebar-link active" data-action="show-all-apps"><span>Todos os Apps</span></a>
                <a href="#" class="sidebar-link" data-action="show-installed"><span>Instalados</span></a>
                <a href="#" class="sidebar-link" data-action="show-updates"><span>Atualizações</span></a>
                <div class="sidebar-divider"></div>
                <h3 class="sidebar-title">Categorias</h3>
                <div id="sidebar-categories"></div>
                <div class="sidebar-divider"></div>
                <h3 class="sidebar-title">Configurações</h3>
                <div class="sidebar-settings">
                    <label class="settings-label">GitHub token (opcional, aumenta o limite da API)</label>
                    <div class="settings-row">
                        <input type="password" id="github-token-input" placeholder="ghp_..." class="settings-input">
                        <button class="btn-outline btn-small" data-action="save-token">SALVAR</button>
                    </div>
                    <p class="settings-hint" id="downloads-path"></p>
                </div>
            </nav>
            <div class="sidebar-footer">
                <p>v0.1.3 &bull; OPEN SOURCE SUITE</p>
            </div>
        </div>

        <!-- Overlay -->
        <div id="modal-overlay" class="modal-overlay hidden" data-action="close-all-modals"></div>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
