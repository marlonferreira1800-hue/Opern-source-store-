[package]
name = "open-source-store"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
futures = "0.3"
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"

[features]
# by default Tauri runs in production mode
default = [ "custom-protocol" ]
# this feature is used for production builds where `devPath` needs to be bundled into the binary, and is NOT needed for development builds
custom-protocol = [ "tauri/custom-protocol" ]

[profile.release]
opt-level = "s"
strip = true
lto = true
codegen-units = 1
panic = "abort"
