name: Bug report
title: '[Bug]: '
labels: [bug, triage]
description: Reporte um comportamento inesperado ou incorreto do app.
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por reportar! Preencha os campos abaixo para agilizar a correção.
  - type: textarea
    id: descricao
    attributes:
      label: Descrição do bug
      description: O que aconteceu? O que você esperava que acontecesse?
      placeholder: Descreva o problema de forma clara.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      description: Liste os passos exatos para reproduzir o problema.
      placeholder: |
        1. Abra o app
        2. Clique em ...
        3. Veja o erro ...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: dropdown
    id: plataforma
    attributes:
      label: Plataforma
      options:
        - Windows (Tauri desktop)
        - Web (navegador)
        - Godot editor / export
        - Outro
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão do app
      placeholder: ex. 0.1.0
  - type: textarea
    id: logs
    attributes:
      label: Logs / prints de erro
      description: Cole aqui qualquer mensagem de erro do console ou terminal.
      render: shell
